<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Claquete">
  <defs>
    <clipPath id="board">
      <rect x="0" y="0" width="256" height="256" rx="56" ry="56"/>
    </clipPath>
  </defs>
  <g clip-path="url(#board)">
    <rect x="0" y="0" width="256" height="256" fill="#1A1A21"/>
    <!-- clapper bar -->
    <rect x="0" y="0" width="256" height="80" fill="#FFC53D"/>
    <g fill="#0E0E12">
      <rect x="14" y="-24" width="28" height="130" transform="rotate(20 28 40)"/>
      <rect x="86" y="-24" width="28" height="130" transform="rotate(20 100 40)"/>
      <rect x="158" y="-24" width="28" height="130" transform="rotate(20 172 40)"/>
      <rect x="230" y="-24" width="28" height="130" transform="rotate(20 244 40)"/>
    </g>
    <!-- rating bars -->
    <g>
      <rect x="72" y="168" width="30" height="42" rx="8" fill="#24242D"/>
      <rect x="114" y="128" width="30" height="82" rx="8" fill="#FFC53D"/>
      <rect x="156" y="150" width="30" height="60" rx="8" fill="#24242D"/>
    </g>
  </g>
  <rect x="1" y="1" width="254" height="254" rx="55" ry="55" fill="none" stroke="#2E2E38" stroke-width="2"/>
</svg>
