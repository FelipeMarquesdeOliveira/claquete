<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const parametros = new URLSearchParams(location.search);
const tela = parametros.get('tela') || '1-abertura';
const giro = parametros.get('lado') === 'direita' ? -0.38 : 0.38;
const L = 620, A = 1120;

// ------------------------------------------------------------- dimensoes --
// medidas reais do iPhone X, em centimetros
const CORPO = { l: 7.09, a: 14.36, e: 0.77, raio: 1.07 };
const VISOR = { l: 6.25, a: 13.54, raio: 0.65 };
const CHANFRO = 0.14;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);
renderer.setSize(L, A);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const cena = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
cena.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(18, L / A, 1, 300);
camera.position.set(0, 0.4, 60);
camera.lookAt(0, 0.4, 0);

// ---------------------------------------------------------------- luzes --
const chave = new THREE.DirectionalLight(0xffffff, 2.1);
chave.position.set(giro > 0 ? -6 : 6, 20, 13);
chave.castShadow = true;
chave.shadow.mapSize.set(2048, 2048);
chave.shadow.radius = 12;
chave.shadow.blurSamples = 24;
const c = chave.shadow.camera;
c.left = -14; c.right = 14; c.top = 18; c.bottom = -18; c.near = 1; c.far = 60;
cena.add(chave);
cena.add(new THREE.DirectionalLight(0xffffff, 0.6).translateX(14).translateY(5).translateZ(9));

// luz de contorno, para o trilho metalico acender na borda
const contorno = new THREE.DirectionalLight(0xdfe6ff, 1.5);
contorno.position.set(giro > 0 ? -16 : 16, 3, -8);
cena.add(contorno);

// ---------------------------------------------------------------- corpo --
function retanguloArredondado(l, a, raio) {
  const s = new THREE.Shape();
  const x = -l / 2, y = -a / 2;
  s.moveTo(x + raio, y);
  s.lineTo(x + l - raio, y);
  s.quadraticCurveTo(x + l, y, x + l, y + raio);
  s.lineTo(x + l, y + a - raio);
  s.quadraticCurveTo(x + l, y + a, x + l - raio, y + a);
  s.lineTo(x + raio, y + a);
  s.quadraticCurveTo(x, y + a, x, y + a - raio);
  s.lineTo(x, y + raio);
  s.quadraticCurveTo(x, y, x + raio, y);
  return s;
}

const grupo = new THREE.Group();

const profundidade = CORPO.e - CHANFRO * 2;
const geoCorpo = new THREE.ExtrudeGeometry(
  retanguloArredondado(CORPO.l - CHANFRO * 2, CORPO.a - CHANFRO * 2, CORPO.raio - CHANFRO),
  { depth: profundidade, bevelEnabled: true, bevelThickness: CHANFRO, bevelSize: CHANFRO, bevelSegments: 8, curveSegments: 32 }
);
geoCorpo.translate(0, 0, -profundidade / 2);

const corpo = new THREE.Mesh(geoCorpo, new THREE.MeshPhysicalMaterial({
  color: 0x2b2b31, metalness: 1, roughness: 0.3, envMapIntensity: 1.5, clearcoat: 0.3, clearcoatRoughness: 0.25,
}));
corpo.castShadow = true;
grupo.add(corpo);

const frenteZ = profundidade / 2 + CHANFRO;

// painel de vidro preto (a moldura ao redor da tela)
const painel = new THREE.Mesh(
  new THREE.ShapeGeometry(retanguloArredondado(CORPO.l - 0.1, CORPO.a - 0.1, CORPO.raio - 0.05), 32),
  new THREE.MeshPhysicalMaterial({ color: 0x090a0c, metalness: 0, roughness: 0.12, envMapIntensity: 1.1 })
);
painel.position.z = frenteZ + 0.004;
grupo.add(painel);

// a tela
const textura = new THREE.TextureLoader().load(`tela-${tela}.png`, desenhar);
textura.colorSpace = THREE.SRGBColorSpace;
textura.anisotropy = 8;

const visor = new THREE.Mesh(
  new THREE.PlaneGeometry(VISOR.l, VISOR.a),
  new THREE.MeshBasicMaterial({ map: textura, transparent: true, toneMapped: false })
);
visor.position.z = frenteZ + 0.008;
grupo.add(visor);

// reflexo do vidro por cima de tudo
const vidro = new THREE.Mesh(
  new THREE.ShapeGeometry(retanguloArredondado(CORPO.l - 0.1, CORPO.a - 0.1, CORPO.raio - 0.05), 32),
  new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.05, transparent: true, opacity: 0.06, envMapIntensity: 2.2 })
);
vidro.position.z = frenteZ + 0.012;
grupo.add(vidro);

// botoes laterais
const materialBotao = new THREE.MeshPhysicalMaterial({ color: 0x35353c, metalness: 1, roughness: 0.34, envMapIntensity: 1.4 });
function botao(x, y, altura) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.09, altura, CORPO.e * 0.52), materialBotao);
  b.position.set(x, y, 0);
  b.castShadow = true;
  grupo.add(b);
}
botao(-CORPO.l / 2 - 0.02, 3.5, 0.62);   // silencioso
botao(-CORPO.l / 2 - 0.02, 2.1, 1.05);   // volume +
botao(-CORPO.l / 2 - 0.02, 0.85, 1.05);  // volume -
botao(CORPO.l / 2 + 0.02, 2.3, 1.7);     // liga

// notch
const notch = new THREE.Mesh(
  new THREE.ShapeGeometry(retanguloArredondado(2.09, 0.56, 0.26), 20),
  new THREE.MeshBasicMaterial({ color: 0x000000, toneMapped: false })
);
notch.position.set(0, VISOR.a / 2 - 0.28, frenteZ + 0.011);
grupo.add(notch);

grupo.rotation.y = giro;
grupo.rotation.x = 0.02;
grupo.position.y = 0.7;
cena.add(grupo);

// chao invisivel, so para receber a sombra
const chao = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.3 }));
chao.rotation.x = -Math.PI / 2;
chao.position.y = -CORPO.a / 2 + 0.7 - 0.06;
chao.receiveShadow = true;
cena.add(chao);

let quadros = 0;
function desenhar() {
  renderer.render(cena, camera);
  if (quadros++ < 4) requestAnimationFrame(desenhar);
  else document.title = 'pronto';
}
desenhar();
</script>
</body></html>
